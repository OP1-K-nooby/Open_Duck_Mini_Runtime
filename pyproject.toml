[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Scripts are executable entry points; a top-of-file block guard is idiomatic.
"scripts/*" = ["E402"]

[tool.mypy]
python_version = "3.12"
# Hardware/vendor libraries (board, busio, rustypot, pypot, adafruit_*, pygame,
# cv2, ...) ship no type stubs; don't fail on their missing imports.
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
